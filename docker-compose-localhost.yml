services:
  mysql:
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${LOCAL_DB_DATABASE:-ht_db}
      MYSQL_USER: ${LOCAL_DB_USER:-ht_user}
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD:-password} # 사용자 비밀번호
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: always
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nestjs:
    build:
      context: .
      dockerfile: Dockerfile-localhost
    restart: always
    image: nestjs:local
    container_name: nestjs
    ports:
      - "3000:3000"
    env_file:
      - .env.localhost
    depends_on:
      - mysql
      - redis
    volumes:
      - ./attachments:/app/attachments

volumes:
  mariadb_data:
  redis_data:
