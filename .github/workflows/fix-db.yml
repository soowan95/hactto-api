name: Fix Production DB Migration
on: workflow_dispatch
jobs:
  fix-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env
        env:
          PROD_ENV: ${{ secrets.PROD_ENV_FILE }}
        run: echo "$PROD_ENV" > .env

      - name: Run fix script on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/hactto-api
            EXIST_BLUE=$(docker ps -f "name=hactto-api-blue" -f "status=running" -q)
            if [ -z "$EXIST_BLUE" ]; then
                TARGET_COLOR="green"
            else
                TARGET_COLOR="blue"
            fi
            docker compose run --rm api-${TARGET_COLOR} npx ts-node scripts/fix-prod-db.ts
            docker compose run --rm api-${TARGET_COLOR} npx prisma migrate resolve --applied 20260720082800_rename_visitor_to_user
