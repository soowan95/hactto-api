name: Fix Production DB Migration
on: workflow_dispatch
jobs:
  fix-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env
        env:
          PROD_ENV: ${{ secrets.PROD_ENV_FILE }}
        run: echo "$PROD_ENV" > .env

      - name: Run fix script on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/hactto-api
            EXIST_BLUE=$(docker ps -f "name=hactto-api-blue" -f "status=running" -q)
            if [ -z "$EXIST_BLUE" ]; then
                TARGET_COLOR="green"
            else
                TARGET_COLOR="blue"
            fi
            
            cat << 'EOF' > fix.js
            const { execSync } = require('child_process');
            const { PrismaClient } = require('./dist/generated/prisma/client');
            const { PrismaMariaDb } = require('@prisma/adapter-mariadb');
            
            async function main() {
              const host = process.env.DATABASE_HOST;
              const user = process.env.DATABASE_USER;
              const password = process.env.DATABASE_PASSWORD;
              const database = process.env.DATABASE_NAME;
              const dbUrl = `mysql://${encodeURIComponent(user)}:${encodeURIComponent(password)}@${host}:3306/${database}?sslaccept=accept_invalid_certs`;
            
              console.log("Resolving migration...");
              try {
                execSync('npx prisma migrate resolve --applied 20260720082800_rename_visitor_to_user', { env: { ...process.env, DATABASE_URL: dbUrl }, stdio: 'inherit' });
              } catch (e) { console.log(e.message); }
            
              console.log("Running manual fixes...");
              const adapter = new PrismaMariaDb({ host, user, password, database, connectionLimit: 1, ssl: { rejectUnauthorized: false } });
              const prisma = new PrismaClient({ adapter });
            
              console.log("Dumping columns for user table:");
              const cols = await prisma.$queryRawUnsafe("SHOW COLUMNS FROM `user`;");
              console.log(JSON.stringify(cols, null, 2));
              
              await prisma.$disconnect();
              console.log("Done!");
              process.exit(0);
            }
            main();
            EOF
            
            docker compose run --rm -v $(pwd)/fix.js:/app/fix.js api-${TARGET_COLOR} node /app/fix.js
