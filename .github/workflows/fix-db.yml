name: Fix Production DB Migration

on:
  workflow_dispatch:

jobs:
  fix-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env
        env:
          PROD_ENV: ${{ secrets.PROD_ENV_FILE }}
        run: echo "$PROD_ENV" > .env

      - name: Run fix script on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/hactto-api
            EXIST_BLUE=$(docker ps -f "name=hactto-api-blue" -f "status=running" -q)
            if [ -z "$EXIST_BLUE" ]; then
                TARGET_COLOR="green"
            else
                TARGET_COLOR="blue"
            fi
            
            cat << 'SCRIPT_EOF' > fix.js
            const { PrismaClient } = require('./dist/generated/prisma/client');
            const { PrismaMariaDb } = require('@prisma/adapter-mariadb');
            
            async function main() {
              const host = process.env.DATABASE_HOST;
              const user = process.env.DATABASE_USER;
              const password = process.env.DATABASE_PASSWORD;
              const database = process.env.DATABASE_NAME;
              const adapter = new PrismaMariaDb({ host, user, password, database, connectionLimit: 1, ssl: { rejectUnauthorized: false } });
              const prisma = new PrismaClient({ adapter });
            
              console.log("Recreating hallucinated tables with CORRECT Prisma schema...");
              
              await prisma.$executeRawUnsafe("DROP TABLE IF EXISTS \`login_fail_log\`;");
              await prisma.$executeRawUnsafe("CREATE TABLE \`login_fail_log\` ( \`id\` INTEGER NOT NULL AUTO_INCREMENT, \`ip\` VARCHAR(191) NOT NULL, \`email\` VARCHAR(191) NOT NULL, \`fail_count\` INTEGER NOT NULL DEFAULT 0, \`locked_until\` DATETIME(3) NULL, \`created_at\` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3), \`updated_at\` DATETIME(3) NOT NULL, PRIMARY KEY (\`id\`), UNIQUE INDEX \`login_fail_log_ip_email_key\`(\`ip\`, \`email\`) ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;");

              await prisma.$executeRawUnsafe("DROP TABLE IF EXISTS \`privacy_policy\`;");
              await prisma.$executeRawUnsafe("CREATE TABLE \`privacy_policy\` ( \`id\` INTEGER NOT NULL AUTO_INCREMENT, \`version\` VARCHAR(50) NULL, \`content\` TEXT NOT NULL, \`created_at\` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3), PRIMARY KEY (\`id\`) ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;");

              await prisma.$executeRawUnsafe("DROP TABLE IF EXISTS \`terms_of_service\`;");
              await prisma.$executeRawUnsafe("CREATE TABLE \`terms_of_service\` ( \`id\` INTEGER NOT NULL AUTO_INCREMENT, \`version\` VARCHAR(50) NULL, \`content\` TEXT NOT NULL, \`created_at\` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3), PRIMARY KEY (\`id\`) ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;");

              await prisma.$disconnect();
              console.log("Done!");
              process.exit(0);
            }
            main();
            SCRIPT_EOF
            
            docker compose run --rm -v $(pwd)/fix.js:/app/fix.js api-${TARGET_COLOR} node /app/fix.js
