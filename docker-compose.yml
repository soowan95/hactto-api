version: '3.8'

services:
  mysql:
    image: mariadb:10.6
    container_name: hactto-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: hactto-redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  api-blue:
    image: your-dockerhub-id/hactto-api:latest
    container_name: hactto-api-blue
    ports:
      - "8080:3000"
    restart: always
    environment:
      - TZ=Asia/Seoul
    env_file:
      - .env
    depends_on:
      - redis
      - mysql
    volumes:
      - /var/hactto/attachments:/app/attachments

  api-green:
    image: your-dockerhub-id/hactto-api:latest
    container_name: hactto-api-green
    ports:
      - "8081:3000"
    restart: always
    environment:
      - TZ=Asia/Seoul
    env_file:
      - .env
    depends_on:
      - redis
      - mysql
    volumes:
      - /var/hactto/attachments:/app/attachments

volumes:
  redis_data:
  mariadb_data:
